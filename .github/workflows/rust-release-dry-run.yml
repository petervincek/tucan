# Dry-run workflow for validating release packaging without creating a GitHub Release.
#
# Intent:
# - Build the same compatibility matrix as production release.
# - Produce archives and checksums so you can inspect output quality.
# - Keep this manual to test process changes safely before tagging.

name: Rust Release Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: tucan
  CARGO_TERM_COLOR: always

jobs:
  dry-run-build:
    name: Dry run ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: tucan
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: tucan
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: tucan
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: tucan.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          # Expose build identity inside the binary for in-app version display tests.
          TUCAN_GIT_TAG: dry-run-${{ github.run_number }}
          TUCAN_GIT_SHA: ${{ github.sha }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="dry-run-${GITHUB_RUN_NUMBER}"
          ASSET_BASE="${APP_NAME}-${VERSION}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.bin_name }}"
          tar -C dist -czf "${ASSET_BASE}.${{ matrix.archive_ext }}" "${{ matrix.bin_name }}"
          shasum -a 256 "${ASSET_BASE}.${{ matrix.archive_ext }}" > "${ASSET_BASE}.${{ matrix.archive_ext }}.sha256"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "dry-run-$env:GITHUB_RUN_NUMBER"
          $AssetBase = "${env:APP_NAME}-$Version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.bin_name }}"
          Compress-Archive -Path "dist/${{ matrix.bin_name }}" -DestinationPath "$AssetBase.${{ matrix.archive_ext }}" -Force
          (Get-FileHash "$AssetBase.${{ matrix.archive_ext }}" -Algorithm SHA256).Hash + "  " + "$AssetBase.${{ matrix.archive_ext }}" | Out-File "$AssetBase.${{ matrix.archive_ext }}.sha256" -Encoding ascii

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ matrix.target }}
          path: |
            ${{ env.APP_NAME }}-dry-run-${{ github.run_number }}-${{ matrix.target }}.${{ matrix.archive_ext }}
            ${{ env.APP_NAME }}-dry-run-${{ github.run_number }}-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error
