[package]
name = "tucan"
version = "0.1.0"
edition = "2024"

authors = ["Peter Vincek"]
description = "TUI Kanban boad application for managing your own tasks"

license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
chrono = {version = "0.4", features = ["serde"]}
directories = "6.0"
once_cell = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["sqlite", "chrono", "runtime-tokio"] }
textwrap = "0.16.2"
thiserror = "2.0.19"
toml = "1.1.3"
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std", "env-filter"] }
tracing-appender = "0.2"
tui-textarea-2 = { version = "0.12.1", features = ["crossterm"] } 
uuid = { version = "1.24.0", features = ["v4", "serde"] }
ratatui = "0.30.2"
# ratatui-markdown = { version = "0.3.6", features = ["preview"] }
the-other-tui-markdown = "0.1"
crossterm = "0.29"
color-eyre = "0.6"

[dev-dependencies]
tempfile = "3"