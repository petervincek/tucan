[package]
name = "tucan"
version = "0.1.0"
edition = "2024"

authors = ["Peter Vincek"]
description = "TUI Kanban boad application for managing your own tasks"

license = "Apache-2.0"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
tokio = { version = "1.52.2", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std", "env-filter"] }
tracing-appender = "0.2"
tui-textarea-2 = { version = "0.12", features = ["crossterm"] } 
uuid = { version = "1.23.4", features = ["v4"] }
ratatui = "0.30.2"
crossterm = "0.29"
color-eyre = "0.6"

[dev-dependencies]
tempfile = "3"